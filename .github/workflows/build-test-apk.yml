# Builds an installable APK on GitHub's servers and publishes it as a release,
# so the app can be put on a phone without installing Android Studio or any
# build tools locally.
#
# Runs only when started by hand, from the Actions tab. Nothing happens on push.

name: Build installable APK

on:
  workflow_dispatch:

permissions:
  # Needed to attach the built APK to a release. Nothing else is granted.
  contents: write

jobs:
  build:
    name: Build and publish debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # Action versions are kept current because the previous ones ran on
      # Node.js 20, which GitHub has deprecated: the runner was already forcing
      # them onto Node.js 24 and warning about it on every build.
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          # Temurin, not Adopt: setup-java v5 deprecated the legacy Adopt
          # distributions, and Adopt stopped receiving updates years ago.
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle, with caching
        uses: gradle/actions/setup-gradle@v6

      - name: Install the Android SDK packages this project needs
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      # Tests run before the build on purpose. If they fail, the APK is never
      # published, so a broken build cannot quietly reach a phone.
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      # Lint is reported but does not block. A different lint version on the
      # runner can surface new findings, and that should not stand between a
      # working build and a phone. Unit tests above do block, because they are
      # pure JVM and behave identically everywhere.
      - name: Check for lint errors
        continue-on-error: true
        run: ./gradlew :app:lintDebug

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug

      # The build that matters. Everything above is a debug build, which is not
      # what reaches users: the release build passes through R8, which shrinks,
      # obfuscates and strips resources. A missing keep rule there would leave an
      # app that installs, opens, and finds nothing in its own dictionary -
      # invisible in debug testing and broken in production. This variant is the
      # release build signed with the debug key so it can actually be installed.
      - name: Build the release-shaped APK (R8 applied, debug-signed)
        run: ./gradlew :app:assembleReleaseCheck

      - name: Report both APK sizes
        run: |
          DEBUG=app/build/outputs/apk/debug/app-debug.apk
          CHECK=app/build/outputs/apk/releaseCheck/app-releaseCheck.apk
          echo "debug:        $(du -h "$DEBUG" | cut -f1)"
          echo "releaseCheck: $(du -h "$CHECK" | cut -f1)"

      # Fails the build if R8 stripped the field names kotlinx.serialization
      # matches the bundled dictionary on. Cheap, and it catches the exact
      # failure this variant exists to guard against.
      - name: Check R8 did not break the dictionary
        run: |
          CHECK=app/build/outputs/apk/releaseCheck/app-releaseCheck.apk
          unzip -p "$CHECK" 'classes*.dex' > /tmp/all.dex
          missing=0
          for name in riskTier cautionGroups whatItIs whyUsed eNumber riskReason; do
            if grep -aq "$name" /tmp/all.dex; then
              echo "ok      $name"
            else
              echo "MISSING $name"
              missing=1
            fi
          done
          if ! unzip -l "$CHECK" | grep -q ingredients_seed.json; then
            echo "MISSING the ingredients_seed.json asset"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "R8 removed something the dictionary needs. Do not ship this."
            exit 1
          fi

      - name: Publish the APK as a release, so a phone can download it
        env:
          # Only this one value is referenced. The environment is never dumped.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="test-build-$(date -u +%Y%m%d-%H%M%S)"

          # Written to a file rather than inlined, because a heredoc nested
          # inside a YAML block scalar is easy to get subtly wrong.
          {
            echo "Two builds for testing on a real phone."
            echo
            echo "**Install \`app-releaseCheck.apk\` — this is the one that matters.**"
            echo
            echo "1. Open this page on your Android phone"
            echo "2. Tap \`app-releaseCheck.apk\` under Assets below"
            echo "3. Open the downloaded file and allow installation when asked"
            echo
            echo "### Why two"
            echo
            echo "| File | What it is |"
            echo "| --- | --- |"
            echo "| \`app-releaseCheck.apk\` | The **release** build, shrunk and obfuscated by R8 exactly as the Play Store version will be. Testing this is the only way to know the shipped app works. Installs as \`com.labeltruth.app.rc\`. |"
            echo "| \`app-debug.apk\` | The debug build. Not minified, so crashes are easier to read. Installs as \`com.labeltruth.app.debug\`. |"
            echo
            echo "Both use separate application ids, so they sit alongside each"
            echo "other and alongside a future Play Store install."
            echo
            echo "Neither is signed with the upload key, so neither can be"
            echo "uploaded to Google Play."
          } > release-notes.md

          gh release create "$TAG" \
            app/build/outputs/apk/releaseCheck/app-releaseCheck.apk \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "LabelTruth test build ${TAG}" \
            --prerelease \
            --notes-file release-notes.md

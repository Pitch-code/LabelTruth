<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500"
     role="img" aria-label="LabelTruth — know what's really in your food">
  <title>LabelTruth feature graphic</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B6B4E"/>
      <stop offset="0.55" stop-color="#0E7C5A"/>
      <stop offset="1" stop-color="#16B981"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- Left column is constrained to x 64..552 so no text can collide with the
       card at x=576. The block is centred vertically against the card. -->

  <!-- App mark -->
  <g transform="translate(64 144) scale(0.2031)">
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="22"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M96 168 V120 Q96 96 120 96 H168"/>
      <path d="M416 168 V120 Q416 96 392 96 H344"/>
      <path d="M96 344 V392 Q96 416 120 416 H168"/>
      <path d="M416 344 V392 Q416 416 392 416 H344"/>
    </g>
    <path d="M256 160 C336 204 342 308 256 352 C170 308 176 204 256 160 Z" fill="#FFFFFF"/>
    <path d="M225 261 L247 283 L291 231" fill="none" stroke="#0E7C5A"
          stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark and promise. Deliberately minimal: Play often renders this
       around 400px wide, so small text would simply vanish. -->
  <text x="188" y="216" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="60" font-weight="700" fill="#FFFFFF" letter-spacing="-1.4">LabelTruth</text>

  <text x="66" y="298" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="30" font-weight="400" fill="#DDF7EC">Know what's really in your food</text>

  <text x="66" y="342" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="21" font-weight="400" fill="#B9EED9">Sources you can check. Works offline.</text>

  <!-- Product hint: score ring plus colour-coded ingredients, so the graphic
       shows what the app does rather than only who it is. -->
  <g>
    <rect x="576" y="96" width="384" height="308" rx="26"
          fill="#FFFFFF" fill-opacity="0.11" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="2"/>

    <circle cx="668" cy="250" r="54" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="13"/>
    <circle cx="668" cy="250" r="54" fill="none" stroke="#6EE7B7" stroke-width="13"
            stroke-linecap="round" stroke-dasharray="271 340"
            transform="rotate(-90 668 250)"/>
    <text x="668" y="262" text-anchor="middle"
          font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="36" font-weight="700" fill="#FFFFFF">82</text>

    <g font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" fill="#F2FFFA">
      <circle cx="762" cy="193" r="7" fill="#16B981"/>
      <text x="782" y="200">Curcumin</text>

      <circle cx="762" cy="250" r="7" fill="#F5A524"/>
      <text x="782" y="257">Palm Oil</text>

      <circle cx="762" cy="307" r="7" fill="#EF4444"/>
      <text x="782" y="314">Sodium Nitrite</text>
    </g>
  </g>
</svg>
